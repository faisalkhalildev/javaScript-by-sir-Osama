<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>javaScript</title>
</head>
<body>
    <script>
        function* myFunc(){
            yield 1;
            yield 2;
            yield 3;
        };

        const gen = myFunc()
        const myArray = [...gen]
        console.log('myArray: ', myArray);
        console.log('gen: ', gen.next());
        console.log('gen: ', gen.next());
        console.log('gen: ', gen.next());
        
    </script>
</body>
</html>
